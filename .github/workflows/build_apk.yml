name: Build Android APK (Official v0.8.x)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      XEX_TOKEN: ${{ secrets.XEX_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21 & .NET 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Build Dependencies & Clang 20
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install -y \
            cmake ninja-build python3 p7zip-full zip unzip \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-xcb-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            clang-20 lld-20 llvm-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.31.6" > /dev/null

      - name: Download 3 XEX Executables from Private Repo
        run: |
          API=https://api.github.com/repos/mangodep80-rgb/fh1-xex
          mkdir -p .local/game/base .local/logs
          curl -fSL -H "Authorization: Bearer $XEX_TOKEN" "$API/releases/latest" -o /tmp/release.json
          python3 - <<'PY'
          import json, os, subprocess, sys
          rel = json.load(open('/tmp/release.json'))
          token = os.environ['XEX_TOKEN']
          expected = {'default.xex', 'SpeechFacade_default.xex', 'XMediaFacade_default.xex'}
          found = {a['name']: a for a in rel.get('assets', []) if a['name'] in expected}
          missing = expected - set(found)
          if missing:
              sys.exit(f"Missing files: {missing}")
          for name, a in found.items():
              out = f".local/game/base/{name}"
              subprocess.run([
                  'curl', '-fSL',
                  '-H', f'Authorization: Bearer {token}',
                  '-H', 'Accept: application/octet-stream',
                  '-o', out, a['url'],
              ], check=True)
              print(name, os.path.getsize(out), 'bytes')
          PY

      - name: Inspect Android Build Scripts & Build APK
        run: |
          ls -la tools/ docs/
          if [ -f "tools/pinyon.py" ]; then
            python3 tools/pinyon.py --help
          fi
          # Mencari skrip build android resmi di dalam folder tools
          ANDROID_SCRIPT=$(find tools -maxdepth 2 -iname "*android*" | head -n 1)
          echo "Found script: $ANDROID_SCRIPT"
          if [[ "$ANDROID_SCRIPT" == *.py ]]; then
            python3 "$ANDROID_SCRIPT"
          elif [[ "$ANDROID_SCRIPT" == *.sh ]]; then
            bash "$ANDROID_SCRIPT"
          else
            python3 tools/pinyon.py build-android || python3 tools/pinyon.py android
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinyon-shift-0.8.2-android
          path: |
            **/*.apk
            !**/build/intermediates/**
