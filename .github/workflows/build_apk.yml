name: Build Android APK (Official v0.9.5)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      XEX_TOKEN: ${{ secrets.XEX_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Build Dependencies & Clang 20
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install -y \
            cmake ninja-build python3 p7zip-full zip unzip \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-xcb-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            clang-20 lld-20 llvm-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.31.6" > /dev/null

      - name: Download 3 XEX & Turnip ZIP from Private Repo
        run: |
          API=https://api.github.com/repos/mangodep80-rgb/fh1-xex
          DEST=.local/android/drivers/turnip-gen8-v37
          mkdir -p .local/game/base .local/logs "$DEST"
          curl -fSL -H "Authorization: Bearer $XEX_TOKEN" "$API/releases/latest" -o /tmp/release.json
          python3 - <<'PY'
          import json, os, subprocess, sys
          rel = json.load(open('/tmp/release.json'))
          token = os.environ['XEX_TOKEN']
          assets = {a['name']: a for a in rel.get('assets', [])}

          expected_xex = ['default.xex', 'SpeechFacade_default.xex', 'XMediaFacade_default.xex']
          for name in expected_xex:
              if name not in assets:
                  sys.exit(f"File tidak ditemukan di rilis: {name}")
              subprocess.run([
                  'curl', '-fSL',
                  '-H', f'Authorization: Bearer {token}',
                  '-H', 'Accept: application/octet-stream',
                  '-o', f'.local/game/base/{name}',
                  assets[name]['url'],
              ], check=True)
              print(name, 'berhasil diunduh')

          zip_assets = [a for name, a in assets.items() if name.endswith('.zip')]
          if not zip_assets:
              sys.exit("File driver .zip tidak ditemukan di rilis!")
          subprocess.run([
              'curl', '-fSL',
              '-H', f'Authorization: Bearer {token}',
              '-H', 'Accept: application/octet-stream',
              '-o', '/tmp/turnip.zip',
              zip_assets[0]['url'],
          ], check=True)
          print('Driver ZIP berhasil diunduh:', zip_assets[0]['name'])
          PY
          unzip -oq /tmp/turnip.zip -d "$DEST/"
          ls -la "$DEST/"

      - name: Build code generator
        run: |
          cd thirdparty/shiftglue-sdk
          cmake --preset linux-amd64
          cmake --build out/build/linux-amd64 --config Release --target rexglue --parallel 4

      - name: Generate recompiled sources
        run: |
          thirdparty/shiftglue-sdk/out/linux-amd64/Release/rexglue \
            --log-level info --log-file .local/logs/codegen.log \
            codegen config/rexglue/pinyon_shift_manifest.toml --ignore-stamp
          rm -rf thirdparty/shiftglue-sdk/out/build

      - name: Build Android APK via Official pinyon.py
        run: |
          python3 tools/pinyon.py android doctor || true
          python3 tools/pinyon.py android build
          python3 tools/pinyon.py android package || true

      - name: Re-sign APK with fixed key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > /tmp/release.jks
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" sign \
            --ks /tmp/release.jks --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out .local/android/pinyon-shift-signed.apk \
            .local/android/pinyon-shift.apk
          "$BT/apksigner" verify --print-certs .local/android/pinyon-shift-signed.apk
          rm /tmp/release.jks
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinyon-shift-0.9.5-turnip-710-720-722-v4.6
          path: .local/android/pinyon-shift.apk
          include-hidden-files: true
          if-no-files-found: error
